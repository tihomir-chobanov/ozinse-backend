  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generates a 60-minute expiration token linked to the user's email.
      parameters:
      - description: User Email
        in: body
        name: forgot
        required: true
        schema:
          $ref: '#/definitions/model.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token generated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid email format
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: User not found or DB error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request a password reset token
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns a secure JWT token.
      parameters:
      - description: Login Credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid email or password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to generate access token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user with email and password. Other fields get default
        values.
      parameters:
      - description: Registration Credentials
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Invalid JSON or short password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error or email already exists
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/auth/reset-password:
    post:
