basePath: /
definitions:
  model.Age_Category:
    properties:
      icon_url:
        example: https://example.com/age-icon.png
        type: string
      id:
        example: 1
        type: integer
      range:
        example: 10-12
        type: string
    type: object
  model.Category:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Drama
        type: string
    type: object
  model.CategoryMovieCount:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      total_movies:
        type: integer
    type: object
  model.CreateMainPageEntryRequest:
    properties:
      icon_url:
        type: string
      position:
        minimum: 1
        type: integer
      project_id:
        type: integer
    required:
    - icon_url
    - position
    - project_id
    type: object
  model.CreateProjectDTO:
    properties:
      age_categories:
        items:
          $ref: '#/definitions/model.Age_Category'
        type: array
      age_category_ids:
        items:
          type: integer
        type: array
      categories:
        items:
          $ref: '#/definitions/model.Category'
        type: array
      category_ids:
        items:
          type: integer
        type: array
      cover_image_url:
        example: https://example.com/poster.png
        type: string
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      description:
        example: A short description of the project.
        type: string
      director:
        example: Jane Doe
        type: string
      duration:
        example: 120
        type: integer
      episodes:
        items:
          $ref: '#/definitions/model.Episode'
        type: array
      genre_ids:
        items:
          type: integer
        type: array
      genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      id:
        example: 1
        type: integer
      is_featured:
        example: false
        type: boolean
      keywords:
        example: action,thriller
        type: string
      producer:
        example: John Smith
        type: string
      release_year:
        example: 2024
        type: integer
      screenshots:
        items:
          $ref: '#/definitions/model.ProjectScreenshot'
        type: array
      seasons:
        items:
          $ref: '#/definitions/model.Season'
        type: array
      title:
        example: Example Movie
        type: string
      type:
        example: movie
        type: string
    type: object
  model.Episode:
    properties:
      duration:
        example: 45
        type: integer
      episode_number:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      season_id:
        example: 10
        type: integer
      youtube_video_id:
        example: dQw4w9WgXcQ
        type: string
    type: object
  model.FavoriteRequest:
    properties:
      project_id:
        type: integer
    required:
    - project_id
    type: object
  model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.Genre:
    properties:
      icon_url:
        example: https://example.com/icon.png
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Action
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.MainPageProject:
    properties:
      icon_url:
        type: string
      id:
        type: integer
      position:
        type: integer
      project:
        allOf:
        - $ref: '#/definitions/model.Project'
        description: Вграждаме целия съществуващ модел Project
    type: object
  model.Permission:
    properties:
      access_level:
        type: string
      id:
        type: integer
      module:
        type: string
      role_id:
        type: integer
    type: object
  model.Project:
    properties:
      age_categories:
        items:
          $ref: '#/definitions/model.Age_Category'
        type: array
      categories:
        items:
          $ref: '#/definitions/model.Category'
        type: array
      cover_image_url:
        example: https://example.com/poster.png
        type: string
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      description:
        example: A short description of the project.
        type: string
      director:
        example: Jane Doe
        type: string
      duration:
        example: 120
        type: integer
      episodes:
        items:
          $ref: '#/definitions/model.Episode'
        type: array
      genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      id:
        example: 1
        type: integer
      is_featured:
        example: false
        type: boolean
      keywords:
        example: action,thriller
        type: string
      producer:
        example: John Smith
        type: string
      release_year:
        example: 2024
        type: integer
      screenshots:
        items:
          $ref: '#/definitions/model.ProjectScreenshot'
        type: array
      seasons:
        items:
          $ref: '#/definitions/model.Season'
        type: array
      title:
        example: Example Movie
        type: string
      type:
        example: movie
        type: string
    type: object
  model.ProjectScreenshot:
    properties:
      id:
        example: 1
        type: integer
      project_id:
        example: 42
        type: integer
      url_to_image:
        example: https://example.com/screenshot.png
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 7
        type: string
    required:
    - email
    - password
    type: object
  model.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  model.Role:
    properties:
      id:
        type: integer
      name:
        type: string
